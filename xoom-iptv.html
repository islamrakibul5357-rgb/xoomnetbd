<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xoom IPTV</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#08111f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#101d32;
    padding:22px 18px;
    border-bottom:1px solid #263754;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    color:#aebbd0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.player{
    background:#000;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:18px;
}

video{
    width:100%;
    height:auto;
    min-height:220px;
    background:#000;
    display:block;
}

.url-box{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:230px;
    padding:15px;
    border-radius:12px;
    border:1px solid #344866;
    background:#101d32;
    color:white;
    font-size:15px;
}

button,.download{
    padding:14px 18px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
    font-size:15px;
}

.play{background:#1677ff}
.copy{background:#7c3aed}
.download{background:#16a34a}
.save{background:#ea580c}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

.card{
    margin-top:18px;
    padding:18px;
    border-radius:16px;
    background:#101d32;
    border:1px solid #263754;
}

.card h2{
    margin:0 0 8px;
}

.link{
    color:#aebbd0;
    word-break:break-all;
}
</style>
</head>

<body>

<header>
    <h1>📺 Xoom IPTV</h1>
    <p>Xoom Net IPTV Player</p>
</header>

<div class="container">

    <div class="player">
        <video id="video" controls playsinline></video>
    </div>

    <div class="url-box">
        <input id="m3u8"
        value="http://172.16.254.200/tv.m3u8">

        <button class="play" onclick="playIPTV()">
            ▶ Play
        </button>
    </div>

    <div class="buttons">

        <button class="copy" onclick="copyM3U8()">
            📋 Copy
        </button>

        <a class="download"
           id="downloadLink"
           href="http://172.16.254.200/tv.m3u8"
           download="xoom-tv.m3u8">
            ⬇ Download M3U8
        </a>

        <button class="save" onclick="savePlaylist()">
            ⬇ Save Playlist
        </button>

    </div>

    <div class="card">
        <h2>IPTV M3U8 Link</h2>
        <div class="link" id="showLink">
            http://172.16.254.200/tv.m3u8
        </div>
    </div>

</div>

<script>

const input = document.getElementById("m3u8");
const video = document.getElementById("video");

function playIPTV(){

    const url = input.value.trim();

    if(!url){
        alert("M3U8 link দিন");
        return;
    }

    video.src = url;
    video.play().catch(function(){
        alert("এই M3U8 লিংকটি ব্রাউজারে সরাসরি Play করা যাচ্ছে না।");
    });
}

function copyM3U8(){

    navigator.clipboard.writeText(input.value)
    .then(function(){
        alert("M3U8 Link Copied!");
    });
}

function savePlaylist(){

    const url = input.value.trim();

    const playlist =
`#EXTM3U
#EXTINF:-1,Xoom IPTV
${url}
`;

    const blob = new Blob(
        [playlist],
        {type:"application/x-mpegURL"}
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "xoom-playlist.m3u";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
}

input.addEventListener("input",function(){

    document.getElementById("showLink").textContent =
        input.value;

    document.getElementById("downloadLink").href =
        input.value;

});

</script>

</body>
</html>}
</script>
</body>
</html>
