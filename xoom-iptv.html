<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xoom IPTV</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
header{padding:18px 16px;background:#111b2e;position:sticky;top:0;z-index:5;border-bottom:1px solid #26344d}
h1{margin:0;font-size:24px} .sub{opacity:.7;margin-top:5px;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:16px}
.player{background:#000;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0008}
video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input{flex:1;min-width:220px;padding:12px;border-radius:10px;border:1px solid #34435e;background:#111b2e;color:#fff}
button{padding:12px 16px;border:0;border-radius:10px;background:#1677ff;color:#fff;font-weight:700}
.card{background:#111b2e;border:1px solid #26344d;border-radius:14px;padding:14px;margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;opacity:.7;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>📺 Xoom IPTV</h1>
  <div class="sub">Xoom Net IPTV Player</div>
</header>
<div class="wrap">
  <div class="player"><video id="video" controls playsinline></video></div>

  <div class="controls">
    <input id="url" value="http://172.16.254.200/tv.m3u8" placeholder="M3U8 URL">
    <button onclick="playUrl()">▶ Play</button>
    <button onclick="copyUrl()">📋 Copy</button>
  </div>

  <div class="card">
    <b>IPTV M3U8 Link</b>
    <div class="small" id="shown">http://172.16.254.200/tv.m3u8</div>
  </div>

  <div class="card">
    <b>নোট</b>
    <div class="small">এই M3U8 লিংকটি private/local IP হলে Xoom Net-এর নিজের নেটওয়ার্কের বাইরে থেকে ভিডিও নাও চলতে পারে।</div>
  </div>
</div>

<script>
const video=document.getElementById('video');
const urlInput=document.getElementById('url');
const shown=document.getElementById('shown');

function playUrl(){
  const u=urlInput.value.trim();
  shown.textContent=u;
  if(!u) return;
  video.src=u;
  video.play().catch(()=>{});
}
function copyUrl(){
  navigator.clipboard.writeText(urlInput.value).then(()=>alert('M3U8 link copied'));
}
</script>
</body>
</html>
